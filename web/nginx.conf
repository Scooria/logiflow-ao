server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # index.html é o único ficheiro que muda de conteúdo sem mudar de nome a
  # cada deploy — nunca deve ser cacheado, para que uma nova versão do site
  # apareça de imediato (sem precisar de refresh forçado / janela anónima).
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    expires 0;
  }

  # Os ficheiros dentro de /assets/ têm hash no nome (gerado pelo Vite a
  # cada build) — um nome novo por cada mudança de conteúdo, por isso podem
  # ser cacheados de forma agressiva e permanente sem risco de ficar preso
  # numa versão antiga.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
